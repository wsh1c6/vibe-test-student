<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高校选课管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background-color: #f5f7fa;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .panel {
            background: white;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .panel h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid #3498db;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        
        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
        }
        
        textarea:focus {
            outline: none;
            border-color: #3498db;
        }
        
        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background-color: #3498db;
            color: white;
        }
        
        .btn-primary:hover {
            background-color: #2980b9;
        }
        
        .btn-secondary {
            background-color: #95a5a6;
            color: white;
        }
        
        .btn-secondary:hover {
            background-color: #7f8c8d;
        }
        
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .search-box input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .filter-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .filter-tabs .btn {
            padding: 8px 16px;
        }
        
        .filter-tabs .btn.active {
            background-color: #2ecc71;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        
        th {
            background-color: #f8f9fa;
            color: #333;
            font-weight: 600;
        }
        
        tr:hover {
            background-color: #f8f9fa;
        }
        
        .course-type {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .type-public {
            background-color: #e8f5e9;
            color: #2e7d32;
        }
        
        .type-major {
            background-color: #e3f2fd;
            color: #1565c0;
        }
        
        .type-elective {
            background-color: #fff3e0;
            color: #ef6c00;
        }
        
        .empty-message {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 16px;
        }
        
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .stat-item {
            background: white;
            padding: 16px 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .stat-item .label {
            color: #777;
            font-size: 14px;
        }
        
        .stat-item .value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        
        .help-text {
            color: #666;
            font-size: 12px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>高校选课管理系统</h1>
        
        <div class="panel">
            <h2>CSV数据批量导入</h2>
            <form th:action="@{/import}" method="post">
                <div class="form-group">
                    <label for="csvData">请输入CSV格式的选课数据（每行一条记录）：</label>
                    <textarea name="csvData" id="csvData" th:text="${csvData}" placeholder="格式：学生ID,课程ID,课程名称,课程类型&#10;示例：&#10;S000001,C000001,Java程序设计,专业课&#10;S000002,C000003,计算机网络,公共课"></textarea>
                    <p class="help-text">CSV格式：学生ID,课程ID,课程名称,课程类型（每行一条记录）</p>
                </div>
                <button type="submit" class="btn btn-primary">导入数据</button>
                <button type="button" class="btn btn-secondary" onclick="loadSampleData()">加载样例数据</button>
            </form>
        </div>
        
        <div class="panel">
            <h2>选课检索</h2>
            <div class="search-box">
                <form th:action="@{/search}" method="get" style="display:flex; width:100%; gap:10px;">
                    <input type="text" name="keyword" th:value="${searchKeyword}" placeholder="支持按学生ID、课程ID、课程名称、课程类型检索">
                    <button type="submit" class="btn btn-primary">搜索</button>
                </form>
            </div>
            
            <div class="filter-tabs">
                <a th:href="@{/filter(courseType='all')}" class="btn btn-secondary" th:classappend="${filterType == null or filterType == 'all'} ? 'active' : ''">全部</a>
                <a th:href="@{/filter(courseType='公共课')}" class="btn btn-secondary" th:classappend="${filterType == '公共课'} ? 'active' : ''">公共课</a>
                <a th:href="@{/filter(courseType='专业课')}" class="btn btn-secondary" th:classappend="${filterType == '专业课'} ? 'active' : ''">专业课</a>
                <a th:href="@{/filter(courseType='选修课')}" class="btn btn-secondary" th:classappend="${filterType == '选修课'} ? 'active' : ''">选修课</a>
            </div>
        </div>
        
        <div class="panel">
            <h2>选课记录列表</h2>
            
            <div class="stats" th:if="${not #lists.isEmpty(records)}">
                <div class="stat-item">
                    <div class="label">总记录数</div>
                    <div class="value" th:text="${#lists.size(records)}">0</div>
                </div>
            </div>
            
            <div th:if="${message}" class="empty-message" th:text="${message}">
                无匹配选课记录
            </div>
            
            <table th:if="${not #lists.isEmpty(records)}">
                <thead>
                    <tr>
                        <th>序号</th>
                        <th>学生ID</th>
                        <th>课程ID</th>
                        <th>课程名称</th>
                        <th>课程类型</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="record, iterStat : ${records}">
                        <td th:text="${iterStat.count}">1</td>
                        <td th:text="${record.studentId}">S000001</td>
                        <td th:text="${record.courseId}">C000001</td>
                        <td th:text="${record.courseName}">Java程序设计</td>
                        <td>
                            <span class="course-type" 
                                  th:classappend="${record.courseType == '公共课'} ? 'type-public' : (${record.courseType == '专业课'} ? 'type-major' : 'type-elective')"
                                  th:text="${record.courseType}">专业课</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <script>
        function loadSampleData() {
            window.location.href = '/';
        }
    </script>
</body>
</html>
